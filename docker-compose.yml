version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: wildlife_health
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASS=password123
      - DB_NAME=wildlife_health
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy

    command: >
      bash -c "
      echo 'Initializing Data Warehouse...' &&
      python -m src.database.initialise_warehouse &&
      python -m src.database.populate_dates &&
      python -m src.database.populate_environment &&
      python -m src.database.generate_mock_data &&
      echo 'Starting Dashboard...' &&
      streamlit run src/dashboard.py --server.address=0.0.0.0
      "